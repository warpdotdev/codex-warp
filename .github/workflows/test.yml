name: Plugin Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          shopt -s globstar nullglob
          failed=0
          for f in **/tests/test-*.sh; do
            echo "--- $f ---"
            bash "$f" || failed=1
          done
          exit $failed

  windows-plugin-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PowerShell tests
        shell: powershell
        run: .\tests\test-hooks.ps1
      - name: Verify ConPTY notification delivery
        run: python tests/notification_conpty_test.py -v
